<!DOCTYPE html>
<html>
<head>
    <title>Sign Up - Heartclock</title>
</head>
<body>
    <h1>Sign Up</h1>
    <form method="POST">
        <input type="email" name="email" placeholder="Email" required>
        <input type="password" name="password" placeholder="Password" required>
        <input type="text" name="invite_code" placeholder="Invite code (optional, leave blank if you're the first)">
        <button type="submit">Sign Up</button>
    </form>
</body>
</html>
