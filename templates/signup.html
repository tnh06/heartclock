{% extends "base.html" %}
{% block title %}Heartclock • Sign up{% endblock %}

{% block content %}
    <article class="auth-card center-card">
        <h1>Create your account</h1>
        <p class="muted">Track every date, together.</p>

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <input type="text" name="display_name" placeholder="Your name" maxlength="50" required>
            <input type="email" name="email" placeholder="Email" required>

            <input type="password" name="password" placeholder="Password" autocomplete="new-password"
                   minlength="14" maxlength="72"
                   pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{14,72}"
                   title="At least 14 characters, with an uppercase letter, a lowercase letter and a number" required>
            <small class="muted">At least 14 characters, with an uppercase letter, a lowercase letter and a number.</small>

            <input type="text" name="invite_code" placeholder="Invite code (optional)"
                   class="code-input" autocapitalize="characters" autocomplete="off">

            <button type="submit">Sign up</button>
        </form>

        <p class="muted">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
    </article>
{% endblock %}
