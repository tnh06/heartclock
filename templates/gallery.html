{% extends "base.html" %}
{% block title %}Heartclock - Gallery{% endblock %}

{% block content %}
    <div class="section-head">
        <h2>Gallery</h2>
    </div>

    {% if entries %}
        <div class="gallery-grid">
            {% for entry in entries %}
                <img src="{{ url_for('static', filename='uploads/' + entry.photo_path) }}" alt="{{ entry.title }}">
            {% endfor %}
        </div>
    {% else %}
        <div class="empty">
            <p>No photos yet. Add one next time you log a date.</p>
        </div>
    {% endif %}
{% endblock %}
