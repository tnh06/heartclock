{% extends "base.html" %}
{% block title %}Heartclock - Gallery{% endblock %}

{% block content %}
    <div class="section-head">
        <h2>Gallery</h2>
    </div>

    {% if photos %}
        <div class="gallery-grid">
            {% for p in photos %}
                <a href="{{ url_for('serve_photo', filename=p.filename) }}" target="_blank">
                    <img src="{{ url_for('serve_photo', filename=p.filename) }}" alt="{{ p.entry.title }}" loading="lazy" data-group="gallery">
                </a>
            {% endfor %}
        </div>
    {% else %}
        <div class="empty">
            <p>No photos yet. Add some next time you log a date.</p>
        </div>
    {% endif %}
{% endblock %}
