{% extends "base.html" %}
{% block title %}Heartclock - Edit Date{% endblock %}

{% block content %}
<article class="auth-card">
    <h1>Edit date</h1>
    <label>Photos (optional, up to 10)
        <input type="file" name="photos" accept="image/*" multiple>
    </label>
    {% if entry.photos %}
    <div class="photo-strip">
        {% for p in entry.photos %}
        <label class="photo-edit">
            <img src="{{ url_for('serve_photo', filename=p.filename) }}" alt="">
            <span><input type="checkbox" name="remove_photo" value="{{ p.id }}"> Remove</span>
        </label>
        {% endfor %}
    </div>
    {% endif %}
    <label>Add photos (up to 10 in total)
        <input type="file" name="photos" accept="image/*" multiple>
    </label>
    <form method="POST" enctype="multipart/form-data">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>Title
            <input type="text" name="title" value="{{ entry.title }}" required>
        </label>
        <label>Date
            <input type="date" name="date" value="{{ entry.date }}" required>
        </label>
        <label>Notes
            <textarea name="notes" rows="4">{{ entry.notes or '' }}</textarea>
        </label>
        <div class="form-actions">
            <button type="submit">Save Changes</button>
            <a href="{{ url_for('archive') }}" role="button" class="outline secondary">Cancel</a>
        </div>
    </form>
</article>
{% endblock %}
