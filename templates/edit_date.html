{% extends "base.html" %}
{% block title %}Edit Date - Heartclock{% endblock %}

{% block content %}
    <article class="auth-card">
        <h1>Edit date</h1>
        <form method="POST">
            <label>Title
                <input type="text" name="title" value="{{ entry.title }}" required>
            </label>
            <label>Date
                <input type="date" name="date" value="{{ entry.date }}" required>
            </label>
            <label>Location
                <input type="text" name="location" value="{{ entry.location or '' }}">
            </label>
            <label>Notes
                <textarea name="notes" rows="4">{{ entry.notes or '' }}</textarea>
            </label>
            <button type="submit">Save Changes</button>
        </form>
        <a href="{{ url_for('home_page') }}">Back to your dates</a>
    </article>
{% endblock %}
