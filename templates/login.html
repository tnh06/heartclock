{% extends "base.html" %}
{% block title %}Heartclock • Log in{% endblock %}

{% block content %}
    <article class="auth-card center-card">
        <h1>Welcome back</h1>
        <p class="muted">Log in to see your dates.</p>

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="email" name="email" placeholder="Email" autocomplete="username" required>
            <input type="password" name="password" placeholder="Password" autocomplete="current-password" required>
            <button type="submit">Log in</button>
        </form>

        <p class="muted">New here? <a href="{{ url_for('signup') }}">Sign up</a></p>
    </article>
{% endblock %}
