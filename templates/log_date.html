{% extends "base.html" %}
{% block title %}Heartclock - Log Date{% endblock %}

{% block content %}
    <article class="auth-card">
        <h1>How was it?</h1>
        <p class="muted">You clocked {{ (minutes|int // 60) }}h {{ (minutes|int % 60) }}m together.</p>
        <form method="POST">
            <input type="hidden" name="started_at" value="{{ started_at }}">
            <input type="hidden" name="ended_at" value="{{ ended_at }}">
            <input type="hidden" name="minutes" value="{{ minutes }}">
            <label>Title
                <input type="text" name="title" autocomplete="off" required>
            </label>
            <label>Notes
                <textarea name="notes" rows="4"></textarea>
            </label>
            <div class="form-actions">
                <button type="submit">Save Date</button>
                <a href="{{ url_for('home_page') }}" role="button" class="outline secondary">Discard</a>
            </div>
        </form>
    </article>
{% endblock %}
