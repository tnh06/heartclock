<!DOCTYPE html>
<html>
<head>
    <title>Heartclock</title>
</head>
<body>
    <h1>Your Dates</h1>
    <a href="{{ url_for('logout') }}">Log out</a>

    {% if entries %}
        <ul>
        {% for entry in entries %}
            <li>
                <strong>{{ entry.title }}</strong> — {{ entry.date }}<br>
                {{ entry.location }}<br>
                {{ entry.notes }}
            </li>
        {% endfor %}
        </ul>
    {% else %}
        <p>No dates logged yet.</p>
    {% endif %}
</body>
</html>
